# Automatically performs jobs upon a commit push or pull-request

# This Action builds, tests, and lints the package.{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %} It uploads test
# coverage to Codecov.{% endif %}{% if cookiecutter.mkdocs in ("y", "Y", True, "true", "True") %} Then, it builds the
# documentation and deploys it on GitHub Pages.{% endif %}

# If the commit message matches a semantic version (e.g. "v0.1.2"), a GitHub
# release will be created by the `create_github_release` job.

name: continuous integration

# Allows this Action to be called by a push to `main` or a pull request. Only
# pushes to `main` are included so that a pull request does not run every job
# twice (once for the push to its branch and once for the pull request).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}
  # Lets the Codecov upload authenticate with OIDC instead of a stored token.
  id-token: write{% endif %}

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:

  build_and_test:
    runs-on: ${{"{{"}} matrix.os {{"}}"}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Makes every `uv` command use the matrix version. Otherwise, `uv run`
    # recreates the environment with the version in ".python-version".
    env:
      UV_PYTHON: ${{"{{"}} matrix.python-version {{"}}"}}

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v7
      with:
        python-version: ${{"{{"}} matrix.python-version {{"}}"}}

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: install dependencies
      run: uv sync

    - name: run tests
      run: uv run pytest tests{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %} --cov --cov-report=xml{% endif %}
{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}
    # Requires the Codecov GitHub App to be installed on the repository's
    # account. Codecov merges the uploads from every job in the matrix.
    - name: upload coverage to codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        use_oidc: true
{% endif %}
  lint_and_format:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: install dependencies
      run: uv sync
{% if cookiecutter.pre_commit in ("y", "Y", True, "true", "True") %}
    # The hooks only need to run once, so they are here instead of in the
    # `build_and_test` matrix.
    - name: run pre-commit
      run: uv run pre-commit run -a --show-diff-on-failure
{% endif %}
    - name: run ruff
      run: uv run ruff check --no-fix --output-format=github
{% if cookiecutter.mypy in ("y", "Y", True, "true", "True") %}
    - name: run mypy
      run: uv run mypy
{% endif %}{% if cookiecutter.mkdocs in ("y", "Y", True, "true", "True") %}
  document_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: install dependencies
      run: uv sync
{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}
    # Creates the HTML report that `mkdocs-coverage` adds to the documentation.
    - name: create coverage report
      run: uv run pytest tests --cov --cov-report=html
{% endif %}
    - name: build documentation with mkdocs
      run: uv run mkdocs build

    - name: deploy documentation to github pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: uv run mkdocs gh-deploy --force --clean --verbose
{% endif %}
  # Only triggered if a line of the commit message is a semantic version (e.g.
  # "v0.1.2"). The `m` flag lets the version be followed by other lines, such
  # as a "Co-Authored-By:" trailer. Releases are only made from the `main`
  # branch and after the tests and linters pass.
  create_github_release:
    name: create github release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build_and_test, lint_and_format]
    runs-on: ubuntu-latest

    steps:
    - name: initiate github release
      uses: CupOfTea696/gh-action-auto-release@v1.0.2
      with:
        title: "Release: $version"
        tag: "v$semver"
        regex: "/^v#{semver}$/im"
      env:
        GITHUB_TOKEN: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}
