# Automatically updates dependency versions using dependabot.

version: 2
updates:

# Maintains the Python dependencies in `pyproject.toml` and `uv.lock`
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly

# Maintains the versions of the GitHub Actions used in `.github/workflows`
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
