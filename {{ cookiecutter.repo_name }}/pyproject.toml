# Project packaging rules and instructions

[project]
name = "{{cookiecutter.package_name}}"
description = "{{cookiecutter.description}}"
authors = [{name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"}]
{% if cookiecutter.license != "Other" %}license = "{{ {"Apache Software License 2.0": "Apache-2.0", "BSD License": "BSD-3-Clause", "ISC License": "ISC", "GNU General Public License v3": "GPL-3.0-or-later", "MIT License": "MIT"}[cookiecutter.license] }}"
license-files = ["LICENSE"]
{% endif %}readme = "README.md"
requires-python = ">=3.11"
# The version is set by `__version__` in "src/{{cookiecutter.repo_name}}/__init__.py".
dynamic = ["version"]
classifiers = [
    "{{cookiecutter.development_status}}",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"]
keywords = []
dependencies = []

[project.optional-dependencies]


[project.urls]
{% if cookiecutter.mkdocs in ("y", "Y", True, "true", "True") %}Documentation = "https://{{cookiecutter.github_user}}.github.io/{{cookiecutter.repo_name}}"
{% endif %}Repository = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.repo_name}}"
Homepage = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.repo_name}}"
Issues = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.repo_name}}/issues"
{% if cookiecutter.mkdocs in ("y", "Y", True, "true", "True") %}Changelog = "https://{{cookiecutter.github_user}}.github.io/{{cookiecutter.repo_name}}/changelog"{% else %}Changelog = "https://github.com/{{cookiecutter.github_user}}/{{cookiecutter.repo_name}}/blob/main/CHANGELOG.md"{% endif %}

[dependency-groups]
dev = [
    "uv",{% if cookiecutter.mkdocs in ("y", "Y", True, "true", "True") %}
    "markdown-callouts",
    "markdown-exec",
    "mkdocs",
{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}    "mkdocs-coverage",
{% endif %}    "mkdocs-gen-files",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-minify-plugin",
    "mkdocstrings[python]",{% endif %}
    "toml",{% if cookiecutter.mypy in ("y", "Y", True, "true", "True") %}
    "mypy",{% endif %}{% if cookiecutter.pre_commit in ("y", "Y", True, "true", "True") %}
    "pre-commit",{% endif %}
    "ruff",
    {include-group = "tests"}]
tests = [{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}
    "coverage",{% endif %}
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist"]

[build-system]
# Version 1.27 is the first to support SPDX license expressions (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/{{ cookiecutter.repo_name }}/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.repo_name }}"]

{% if cookiecutter.code_coverage in ("y", "Y", True, "true", "True") %}
[tool.coverage.report]
skip_empty = true
show_missing = true
# Adds to (instead of replacing) the default exclusions, such as
# "pragma: no cover".
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["{{ cookiecutter.repo_name }}", "tests"]

{% endif %}
{% if cookiecutter.mypy in ("y", "Y", True, "true", "True") %}
[tool.mypy]
files = ['src']
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

{% endif %}
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--showlocals"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["docs", "scripts", "site", "tests", ".*.*"]
fix = true
line-length = 80
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.fixable = ["ALL"]
lint.ignore = [
    "A001",  # Variable is shadowing a Python builtin
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG003",  # Unused class method argument: `parameters`
    "ARG005",  # Unused lambda argument
    "COM812",  # Recommended disable by Ruff
    "C901",  # Too complex
    "D105",  # Missing docstring in magic method
    "D400",  # First line must end in a period
    "D401",  # First line of docstring should be in imperative mood
    "D406",  # Section name should end with a newline - bugged for 'Attributes:'
    "D407",  # Missing dashed underline after section ("Args")
    "D415",  # First line must end in a period, question mark, or exclamation point
    "E501",  # Line too long
    "E731",  # Do not assign a `lambda` expression, use a `def`
    "ERA001",  # Commented out code
    "EXE002",  # No shebang is present in an executable file
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional arg in function definition
    "G004",  # Logging statement uses f-string
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
    "PLR1711", # Useless 'return' at the end of function
    "Q000",  # Single quotes found but double quotes preferred
    "RET505",  # Unnecessary `else` after `return` statement
    # "S0001",  # Use of assert detected
    "SLF001", # Private member accessed
    "TID252",  # Relative imports are banned
    "TRY003",]  # Avoid specifying long messages outside the exception class
lint.select = [
    "A",  # flake8-buttons
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",  # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C",  #
    "C4",  # flake8-comprehensions
    "COM",  # flake8-commas
    "D",  # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",  # pydocstyle errors
    "ERA",  # eradicate
    "EXE",  # flake8-executable
    "F",  # Pyflakes
    "FBT",  # flake8-boolean-trap
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "N",  # pep8-naming
    "NPY",  # NumPy-specific rules
    "PD",  # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",  # Pylint
    "PLC",  # Pylint
    "PLE",  # Pylint
    "PLR",  # Pylint
    "PLW",  # Pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",  # flake8-quotes
    "RUF",  # Ruff-specific rules
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "S",  # bandit
    "SIM",  # flake8-slots
    "SLF",  # flake8-self
    "T",  #
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # pydocstyle warnings
    "YTT",]  # flake8-2020
lint.task-tags = ["To Do:"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
case-sensitive = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.uv]
package = true

[tool.cruft]
# Paths that `cruft update` leaves alone because they belong to this project
# instead of the `snickerdoodle` template.
skip = ["CHANGELOG.md", "src", "tests", "uv.lock"]
