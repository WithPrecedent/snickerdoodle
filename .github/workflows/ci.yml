# Automatically performs jobs on a commit push or pull request

# This Action tests the template by creating projects with it. Then, it builds
# the documentation and deploys it on GitHub Pages.

# If the commit message matches a semantic version (e.g. "v0.1.2"), a GitHub
# release will be created by the `create_github_release` job.

name: ci

on:
  # Allows this Action to be called by a push to the `main` branch
  push:
    branches:
      - main
  # Allows this Action to be called by a pull request
  pull_request:
  # Allows this Action to be called by other Actions
  workflow_call:
  # Allows this Action to be called through GitHub
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:

  test_template:
    name: Test Template
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Makes every `uv` command use the matrix version. Otherwise, `uv run`
    # recreates the environment with the version in ".python-version".
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0

    # The "quality" group includes `ruff`, which a test runs on the created
    # project.
    - name: install dependencies
      run: uv sync --all-groups

    - name: run tests
      run: uv run pytest

  build_and_deploy_documentation:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"
        activate-environment: true

    - name: install dependencies
      run: uv sync

    - name: build documentation with mkdocs
      run: uv run mkdocs build

    - name: deploy documentation to GitHub Pages
      if: github.event_name != 'pull_request'
      run: uv run mkdocs gh-deploy --force --clean --verbose
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}

  # Only releases if a line of the commit message is a semantic version (e.g.
  # "v0.1.2"), so the version can be followed by other lines, such as a
  # "Co-Authored-By:" trailer. The release notes are the version's section of
  # CHANGELOG.md. Releases are only made after the template tests pass.
  create_github_release:
    name: Create GitHub Release
    if: github.event_name != 'pull_request'
    needs: test_template
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: create github release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(git log -1 --format=%B | grep -m 1 -oxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | cut -c 2- || true)
        if [ -z "$version" ]; then
          echo "The commit message has no version line, so no release was made."
          exit 0
        fi
        if gh release view "v$version" > /dev/null 2>&1; then
          echo "::notice::Release v$version already exists."
          exit 0
        fi
        awk -v v="$version" '$1 == "##" && $2 == v {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::Could not find an entry for $version in CHANGELOG.md"
          exit 1
        fi
        gh release create "v$version" --title "Release: $version" --notes-file notes.md --target "$GITHUB_SHA"
